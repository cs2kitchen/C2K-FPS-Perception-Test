name: Windows build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
          }

      - name: Build application and installer
        shell: powershell
        run: .\build\build.ps1 -SkipInstall -RequireInstaller

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: C2K FPS Perception Test Portable
          path: |
            dist/C2K FPS Perception Test.exe
            dist/C2K FPS Perception Test Portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: C2K FPS Perception Test Setup
          path: dist/C2K FPS Perception Test Setup.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/C2K FPS Perception Test.exe
            dist/C2K FPS Perception Test Setup.exe
            dist/C2K FPS Perception Test Portable.zip
